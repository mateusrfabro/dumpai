<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2a2b"/>
      <stop offset="1" stop-color="#06181a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe6a8"/>
      <stop offset="1" stop-color="#19b98a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="14" fill="url(#acc)"/>
  <!-- 18+ -->
  <circle cx="1095" cy="105" r="52" fill="none" stroke="#2fe6a8" stroke-width="4"/>
  <text x="1095" y="120" fill="#2fe6a8" font-size="40" font-weight="bold" text-anchor="middle">18+</text>

  <text x="100" y="300" fill="#7fb8ac" font-size="34" letter-spacing="6" font-weight="bold">EBOOK · APOSTA ESPORTIVA</text>

  <text x="100" y="470" fill="#ffffff" font-size="120" font-weight="bold" letter-spacing="2">SPORTSBOOK</text>
  <text x="100" y="600" fill="url(#acc)" font-size="120" font-weight="bold" letter-spacing="2">COM MÉTODO</text>

  <rect x="104" y="660" width="180" height="8" fill="url(#acc)"/>
  <text x="100" y="740" fill="#cfe9e2" font-size="40" font-weight="bold">O Modelo de 3 Pilares para apostar</text>
  <text x="100" y="795" fill="#cfe9e2" font-size="40" font-weight="bold">com cabeça de investidor</text>

  <!-- pilares + linha ascendente com oscilacao -->
  <g transform="translate(0,40)">
    <rect x="190" y="1090" width="150" height="180" rx="14" fill="#11403d"/>
    <rect x="430" y="1010" width="150" height="260" rx="14" fill="#15514b"/>
    <rect x="670" y="930"  width="150" height="340" rx="14" fill="#1a6359"/>
    <text x="265" y="1320" fill="#2fe6a8" font-size="30" font-weight="bold" text-anchor="middle">VALOR</text>
    <text x="505" y="1320" fill="#2fe6a8" font-size="30" font-weight="bold" text-anchor="middle">BÔNUS</text>
    <text x="745" y="1320" fill="#2fe6a8" font-size="30" font-weight="bold" text-anchor="middle">BANCA</text>
    <polyline points="150,1180 290,1120 360,1160 470,1040 560,1085 690,960 880,900 1010,940"
      fill="none" stroke="#2fe6a8" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="1010" cy="940" r="12" fill="#ffffff"/>
  </g>

  <text x="100" y="1500" fill="#6f9a91" font-size="28">Conteúdo educacional. Apostas envolvem risco real de perda.</text>
  <text x="100" y="1540" fill="#6f9a91" font-size="28">Não é promessa de lucro. Jogue com responsabilidade.</text>
</svg>
