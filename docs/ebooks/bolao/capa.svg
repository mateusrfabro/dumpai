<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e5a2e"/>
      <stop offset="1" stop-color="#063d1d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd86b"/>
      <stop offset="1" stop-color="#e3b341"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="14" fill="url(#gold)"/>
  <circle cx="1095" cy="105" r="52" fill="none" stroke="#ffd86b" stroke-width="4"/>
  <text x="1095" y="120" fill="#ffd86b" font-size="40" font-weight="bold" text-anchor="middle">18+</text>

  <text x="100" y="300" fill="#a7d8b6" font-size="34" letter-spacing="6" font-weight="bold">EBOOK · BOLÃO COM ESTRATÉGIA</text>

  <text x="100" y="470" fill="#ffffff" font-size="120" font-weight="bold">BOLÃO</text>
  <text x="100" y="590" fill="#ffffff" font-size="120" font-weight="bold">DA COPA</text>
  <text x="100" y="690" fill="url(#gold)" font-size="76" font-weight="bold">COM ESTRATÉGIA</text>

  <rect x="104" y="740" width="180" height="8" fill="url(#gold)"/>
  <text x="100" y="820" fill="#d7efdf" font-size="37" font-weight="bold">Aumente suas chances quando você joga</text>
  <text x="100" y="871" fill="#d7efdf" font-size="37" font-weight="bold">contra as pessoas, não contra a casa</text>

  <!-- chaveamento com pick contrarian destacado + tacas -->
  <g transform="translate(0,40)" stroke="#52a06e" stroke-width="5" fill="none">
    <line x1="200" y1="1080" x2="320" y2="1080"/><line x1="200" y1="1180" x2="320" y2="1180"/>
    <line x1="320" y1="1080" x2="320" y2="1180"/><line x1="320" y1="1130" x2="430" y2="1130"/>
    <line x1="200" y1="1260" x2="320" y2="1260"/><line x1="200" y1="1360" x2="320" y2="1360"/>
    <line x1="320" y1="1260" x2="320" y2="1360"/><line x1="320" y1="1310" x2="430" y2="1310"/>
    <line x1="430" y1="1130" x2="430" y2="1310"/><line x1="430" y1="1220" x2="560" y2="1220"/>
  </g>
  <!-- node contrarian destacado -->
  <circle cx="320" cy="1300" r="20" fill="#ffd86b"/>
  <text x="600" y="1230" fill="url(#gold)" font-size="34" font-weight="bold">a jogada que</text>
  <text x="600" y="1275" fill="url(#gold)" font-size="34" font-weight="bold">a manada ignora</text>
  <!-- taca -->
  <g transform="translate(880,1040)" fill="url(#gold)">
    <path d="M40 0 H140 V40 Q140 120 90 130 Q40 120 40 40 Z"/>
    <rect x="80" y="130" width="20" height="50"/><rect x="55" y="180" width="70" height="20"/>
    <path d="M40 20 Q5 20 5 55 Q5 85 40 80" fill="none" stroke="#e3b341" stroke-width="10"/>
    <path d="M140 20 Q175 20 175 55 Q175 85 140 80" fill="none" stroke="#e3b341" stroke-width="10"/>
  </g>

  <text x="100" y="1520" fill="#7fb893" font-size="27">Estratégia aumenta a chance, não garante o título — a Copa tem muita sorte. +18.</text>
</svg>
