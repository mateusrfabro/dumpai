<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0d16"/>
      <stop offset="1" stop-color="#140509"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6c878"/>
      <stop offset="1" stop-color="#c79a3f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="14" fill="url(#gold)"/>
  <circle cx="1095" cy="105" r="52" fill="none" stroke="#e6c878" stroke-width="4"/>
  <text x="1095" y="120" fill="#e6c878" font-size="40" font-weight="bold" text-anchor="middle">18+</text>

  <text x="100" y="300" fill="#b98c93" font-size="34" letter-spacing="6" font-weight="bold">EBOOK · JOGO CONSCIENTE</text>

  <text x="100" y="470" fill="#ffffff" font-size="118" font-weight="bold" letter-spacing="1">CASSINO</text>
  <text x="100" y="595" fill="url(#gold)" font-size="92" font-weight="bold" letter-spacing="1">COM CONSCIÊNCIA</text>

  <rect x="104" y="650" width="180" height="8" fill="url(#gold)"/>
  <text x="100" y="730" fill="#e8d2cf" font-size="38" font-weight="bold">Jogar com inteligência, perder menos</text>
  <text x="100" y="783" fill="#e8d2cf" font-size="38" font-weight="bold">e saber a hora de parar</text>

  <!-- ficha partida -->
  <g transform="translate(600,1080)">
    <circle r="230" fill="none" stroke="#5e2230" stroke-width="22" stroke-dasharray="36 30"/>
    <circle r="170" fill="#1f0a11" stroke="url(#gold)" stroke-width="6"/>
    <line x1="-250" y1="-30" x2="250" y2="30" stroke="#140509" stroke-width="30"/>
    <text x="0" y="22" fill="url(#gold)" font-size="64" font-weight="bold" text-anchor="middle">RTP</text>
  </g>

  <text x="100" y="1500" fill="#9a6f76" font-size="27">A casa tem vantagem matemática: no longo prazo, o jogador tende a perder.</text>
  <text x="100" y="1540" fill="#9a6f76" font-size="27">Não existe método de ganho. Jogue com responsabilidade. +18.</text>
</svg>
